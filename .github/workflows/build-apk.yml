name: APK বিল্ড

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: নির্ভরতা ইনস্টল
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: টাইপ-চেক (ত্রুটি থাকলেও বিল্ড চলবে; লগ আপলোড হবে)
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee typecheck.log

      - name: Android প্রজেক্ট তৈরি
        run: npx expo prebuild --platform android --clean

      - name: Release APK বিল্ড
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK যাচাই
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" MyPersonalAssistant.apk
          unzip -l MyPersonalAssistant.apk | grep AndroidManifest.xml

      - uses: actions/upload-artifact@v4
        with:
          name: MyPersonalAssistant-apk
          path: MyPersonalAssistant.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: ignore
